<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
</head>
<body bgcolor="#aad563">

    <h2>Customer Feedback Form</h2>
    
    <form action="/submit-feedback" method="POST">
        

        <fieldset>
            <legend>Personal Information</legend>
            <p>
                <label for="full-name">Full Name:</label><br>
                <input type="text" id="full-name" name="fullName" 
                required placeholder="Louisa Hiwatari">
            </p>
            <p>
                <label for="email-address">Email Address:</label><br>
                <input type="email" id="email-address" name="email" 
                required placeholder="hiwatari@example.com">
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Your Experience</legend>
            
            <p>
                <label>How would you rate your overall experience?</label><br>
                <input type="radio" id="vpoor" name="satisfaction" value="vpoor">
                <label for="vpoor">1</label><br>
                
                <input type="radio" id="poor" name="satisfaction" value="poor">
                <label for="poor">2</label><br>
                
                <input type="radio" id="neutral" name="satisfaction" value="neutral" checked>
                <label for="neutral">3</label><br>
                
                <input type="radio" id="good" name="satisfaction" value="good">
                <label for="good">4</label>

                 <input type="radio" id="excellent" name="satisfaction" value="excellent">
                <label for="excellent">5</label>
            </p>
 <p>
                <label>Satisfaction with our range of service</label><br>
                <input type="radio" id="sat-excellent" name="satisfaction" value="very satisfied">
                <label for="sat-excellent">Very Satisfied</label><br>
                
                <input type="radio" id="sat-good" name="satisfaction" value="satisfied">
                <label for="sat-good">Satisfied</label><br>
                
                <input type="radio" id="sat-neutral" name="satisfaction" value="unsatisfied" checked>
                <label for="sat-neutral">Unsatisfied</label><br>
                
                <input type="radio" id="sat-poor" name="satisfaction" value="very unsatisfied">
                <label for="sat-poor">Very Unsatisfied</label>
            </p>

            <p>
                <label for="feedback-category">What area needs the most improvement?</label><br>
                <select id="feedback-category" name="category">
                    <option value="" disabled selected>-- Select an option --</option>
                    <option value="customer-support">Customer Support</option>
                    <option value="product-quality">Product Quality</option>
                    <option value="delivery-speed">Delivery Speed</option>
                    <option value="Battery charging"></option>
                    <option value="other">Other</option>
                </select>
            </p>

            <p>
                <label>Which features do you use most frequently? (Select all that apply)</label><br>
                <input type="checkbox" id="feat-dashboard" name="features" value="dashboard">
                <label for="feat-dashboard">Relocation of Vehicle</label><br>
                
                <input type="checkbox" id="feat-reports" name="features" value="reports">
                <label for="feat-reports">Analytics Reports</label><br>
                
                <input type="checkbox" id="feat-settings" name="features" value="settings">
                <label for="feat-settings">Account Settings</label>
            </p>
            <p>
                <label>Do you find Eco fleet accessible?</label><br>
                <input type="radio" id="yes" name="agreement" value="yes">
                <label for="yes">Yes</label><br>

                 <input type="radio" id="sat-neutral" name="agreement" value="neutral"
                 checked>
                <label for="sat-neutral">Neutral</label><br>

                <input type="radio" id="no" name="agreement" value="no">
                <label for="no">No</label><br>
                
               
                
            
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Detailed Comments</legend>
            <p>
                <label for="comments">Please provide any additional comments or suggestions:
                </label><br>
                <textarea id="comments" name="comments" rows="6" cols="50"
                 placeholder="Write your thoughts here."></textarea>
            </p>
            <p>
                <label for="comments">What should we change inorder to live upto you expectations?
                </label><br>
                <textarea id="comments" name="comments" rows="6" cols="50"
                 placeholder="Write your thoughts here."></textarea>
            </p>
        </fieldset>

        <br>
<p>
                <label>Would you recommend ecofleet to others?</label><br>
                <input type="radio" id="yes" name="agreement" value="excellent">
                <label for="Yes">Yes</label><br>
                
                <input type="radio" id="no" name="agreement" value="bad">
                <label for="no">No</label><br>
            </p>
        <p>
            <input type="submit" value="Submit Feedback">
            <input type="reset" value="Clear Form">
        </p>

    </form>
<h2>Thanks for choosing Eco fleet!</h2>
</body>
</html>
