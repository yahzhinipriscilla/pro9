  <style>
.ef-marquee{overflow:hidden;white-space:nowrap;background:#1b5e20;color:#fff;padding:12px 0;font-family:Arial,sans-serif}
.ef-marquee span{display:inline-block;font-size:1.3rem;animation:ef-slide 12s linear infinite}
@keyframes ef-slide{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.ef-road{position:relative;height:70px;margin:30px 5%;border-bottom:6px dashed #1b5e20}
.ef-car{position:absolute;bottom:0;font-size:3rem;animation:ef-drive 6s ease-in-out infinite alternate}
@keyframes ef-drive{0%{left:0}100%{left:calc(100% - 4rem)}}
.ef-battery{display:block;width:180px;height:56px;border:4px solid #1b5e20;border-radius:10px;background:#fff;position:relative;overflow:hidden;margin:0 auto 20px}
.ef-battery::after{content:"";position:absolute;left:0;top:0;height:100%;background:#43a047;animation:ef-charge 3s ease-in infinite}
@keyframes ef-charge{0%{width:0}100%{width:100%}}
@media (prefers-reduced-motion:reduce){.ef-marquee span,.ef-car,.ef-battery::after{animation:none}}
  </style>
</head>
